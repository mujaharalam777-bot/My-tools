<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0">
<title>Kotha Bolo - Interactive Talking Echo Cartoon</title>
<style>
  /* ===== Reset & Base ===== */
  * { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --skin: #f4c29a;
    --skin-dark: #e0a879;
    --hair: #2b2018;
    --shirt: #3f88f2;
    --shirt-dark: #2f6fd1;
    --accent: #ff5b6a;
    --panel-bg: rgba(255,255,255,0.85);
  }

  html, body {
    height: 100%;
  }

  body {
    font-family: "Hind Siliguri", "Noto Sans Bengali", "Segoe UI", sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow-x: hidden;
    /* Animated 3-color gradient background */
    background: linear-gradient(120deg, #ff9a9e, #a18cd1, #84fab0, #ff9a9e);
    background-size: 400% 400%;
    animation: gradientShift 14s ease infinite;
    padding: clamp(12px, 4vw, 32px);
  }

  @keyframes gradientShift {
    0%   { background-position: 0% 50%; }
    50%  { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
  }

  .app-container {
    width: min(94vw, 480px);
    background: var(--panel-bg);
    backdrop-filter: blur(6px);
    border-radius: clamp(16px, 3vw, 28px);
    padding: clamp(16px, 4vw, 32px);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: clamp(10px, 2vw, 18px);
    box-shadow: 0 20px 50px rgba(0,0,0,0.25);
  }

  .stage {
    width: 100%;
    max-width: 340px;
    aspect-ratio: 1 / 1.1;
  }

  #character-svg {
    width: 100%;
    height: 100%;
    display: block;
  }

  /* ===== Idle sway animation on head+body group ===== */
  #headGroup {
    transform-box: fill-box;
    transform-origin: 50% 100%;
    animation: idleSway 4s ease-in-out infinite;
  }

  @keyframes idleSway {
    0%, 100% { transform: rotate(-2deg); }
    50%      { transform: rotate(2deg); }
  }

  /* Reaction: head nods lightly while listening, replaces idle sway */
  #headGroup.reaction-nod {
    animation: reactionNod 0.6s ease-in-out infinite;
  }

  @keyframes reactionNod {
    0%, 100% { transform: rotate(0deg) translateY(0px); }
    50%      { transform: rotate(0deg) translateY(4px); }
  }

  /* Eyelids: closed by default scale 0, blink toggles scale 1 */
  .eyelid {
    transform-box: fill-box;
    transform-origin: 50% 50%;
    transform: scaleY(0);
    transition: transform 0.09s ease-in-out;
  }
  .eyelid.blink {
    transform: scaleY(1);
  }

  #mouthShape {
    transition: rx 0.08s linear, ry 0.08s linear;
  }

  /* ===== Transcript box ===== */
  .transcript {
    width: 100%;
    min-height: 2.4em;
    text-align: center;
    font-size: clamp(0.95rem, 3vw, 1.15rem);
    color: #222;
    background: rgba(255,255,255,0.6);
    border-radius: 12px;
    padding: 8px 12px;
    word-break: break-word;
  }

  /* ===== Talk Button ===== */
  .talk-btn {
    font-size: clamp(1rem, 3.6vw, 1.3rem);
    font-weight: 700;
    padding: clamp(12px, 3vw, 18px) clamp(20px, 6vw, 34px);
    border: none;
    border-radius: 999px;
    cursor: pointer;
    color: #fff;
    background: linear-gradient(135deg, var(--accent), #ff8a5c);
    box-shadow: 0 8px 20px rgba(255,91,106,0.4);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
    width: 100%;
    max-width: 280px;
  }

  .talk-btn:active {
    transform: scale(0.96);
  }

  .talk-btn.state-listening {
    background: linear-gradient(135deg, #e63946, #ff4d4d);
    animation: pulseGlow 1s ease-in-out infinite;
  }

  .talk-btn.state-speaking {
    background: linear-gradient(135deg, #2f9e44, #51cf66);
  }

  @keyframes pulseGlow {
    0%, 100% { box-shadow: 0 0 0 0 rgba(230,57,70,0.55); }
    50%      { box-shadow: 0 0 0 14px rgba(230,57,70,0); }
  }

  .talk-btn:disabled {
    background: #999;
    cursor: not-allowed;
    box-shadow: none;
  }

  /* ===== Error box ===== */
  .error-message {
    width: 100%;
    text-align: center;
    font-size: clamp(0.85rem, 3vw, 1rem);
    color: #7a0000;
    background: #ffd6d6;
    border-radius: 10px;
    padding: 8px 12px;
  }

  .error-message[hidden] { display: none; }

  /* ===== Responsive tuning for very small / very large screens ===== */
  @media (max-width: 360px) {
    .app-container { padding: 12px; }
  }

  @media (min-width: 1600px) {
    .app-container { width: 480px; }
  }
</style>
</head>
<body>

  <main class="app-container">
    <div class="stage">
      <svg id="character-svg" viewBox="0 0 300 340" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Talking cartoon boy">

        <!-- Body / shirt -->
        <path d="M90,340 L100,240 Q150,215 200,240 L210,340 Z" fill="var(--shirt)" stroke="var(--shirt-dark)" stroke-width="3"/>

        <g id="headGroup">
          <!-- Ears -->
          <circle cx="68" cy="140" r="14" fill="var(--skin)" stroke="var(--skin-dark)" stroke-width="2"/>
          <circle cx="232" cy="140" r="14" fill="var(--skin)" stroke="var(--skin-dark)" stroke-width="2"/>

          <!-- Head -->
          <circle cx="150" cy="140" r="78" fill="var(--skin)" stroke="var(--skin-dark)" stroke-width="3"/>

          <!-- Hair -->
          <path d="M72,120 Q75,45 150,45 Q225,45 228,120 Q210,90 150,88 Q90,90 72,120 Z" fill="var(--hair)"/>

          <!-- Eyebrows -->
          <path d="M108,100 Q122,90 138,98" stroke="var(--hair)" stroke-width="4" fill="none" stroke-linecap="round"/>
          <path d="M162,98 Q178,90 192,100" stroke="var(--hair)" stroke-width="4" fill="none" stroke-linecap="round"/>

          <!-- Left eye -->
          <g id="leftEye">
            <circle cx="122" cy="128" r="13" fill="#fff" stroke="#333" stroke-width="1.5"/>
            <circle cx="122" cy="128" r="6" fill="#2b2018"/>
            <rect id="leftEyelid" class="eyelid" x="107" y="113" width="30" height="30" fill="var(--skin)"/>
          </g>

          <!-- Right eye -->
          <g id="rightEye">
            <circle cx="178" cy="128" r="13" fill="#fff" stroke="#333" stroke-width="1.5"/>
            <circle cx="178" cy="128" r="6" fill="#2b2018"/>
            <rect id="rightEyelid" class="eyelid" x="163" y="113" width="30" height="30" fill="var(--skin)"/>
          </g>

          <!-- Nose -->
          <path d="M148,140 Q145,155 150,158 Q155,155 152,140" fill="none" stroke="var(--skin-dark)" stroke-width="2" stroke-linecap="round"/>

          <!-- Cheeks -->
          <circle cx="105" cy="160" r="9" fill="#ff9e9e" opacity="0.45"/>
          <circle cx="195" cy="160" r="9" fill="#ff9e9e" opacity="0.45"/>

          <!-- Mouth: shape morphs between A / O / M via rx & ry -->
          <ellipse id="mouthShape" cx="150" cy="180" rx="18" ry="4" fill="#8a3b3b" stroke="#5c2222" stroke-width="1.5"/>
        </g>
      </svg>
    </div>

    <div id="transcriptBox" class="transcript" aria-live="polite"></div>

    <button id="talkButton" class="talk-btn" type="button">🎤 Kotha Bolo</button>

    <div id="errorBox" class="error-message" hidden></div>
  </main>

<script>
  'use strict';

  /* ============================================================
   * DOM REFERENCES
   * ============================================================ */
  const talkButton    = document.getElementById('talkButton');
  const transcriptBox = document.getElementById('transcriptBox');
  const errorBox      = document.getElementById('errorBox');
  const headGroup     = document.getElementById('headGroup');
  const mouthShape    = document.getElementById('mouthShape');
  const leftEyelid    = document.getElementById('leftEyelid');
  const rightEyelid   = document.getElementById('rightEyelid');

  /* ============================================================
   * STATE
   * ============================================================ */
  let currentButtonState = 'default'; // 'default' | 'listening' | 'speaking'
  let recognitionInstance = null;
  let silenceTimerId = null;
  let mouthAnimationFrameId = null;
  let mouthAnimationStartTime = 0;
  let cachedVoices = [];

  const SILENCE_TIMEOUT_MS = 3000;
  const ECHO_DELAY_MS = 400;
  const PHONEME_INTERVAL_MS = 150;

  /** Mouth shapes for the three required phonemes plus rest state. */
  const PHONEME_SHAPES = {
    A:    { rx: 24, ry: 26 },
    O:    { rx: 15, ry: 22 },
    M:    { rx: 19, ry: 3  },
    REST: { rx: 18, ry: 4  }
  };
  const PHONEME_SEQUENCE = ['A', 'O', 'M', 'O'];

  /* ============================================================
   * IDLE ANIMATION: RANDOM BLINK EVERY ~2-4s
   * ============================================================ */

  /**
   * Triggers a single blink by toggling the "blink" class on both eyelids
   * for a short duration, then schedules the next blink at a random delay.
   * @returns {void}
   */
  function triggerBlink() {
    leftEyelid.classList.add('blink');
    rightEyelid.classList.add('blink');
    setTimeout(() => {
      leftEyelid.classList.remove('blink');
      rightEyelid.classList.remove('blink');
    }, 140);
  }

  /**
   * Schedules the next blink at a random interval around 3 seconds
   * (2000ms - 4000ms) and re-schedules itself recursively.
   * @returns {void}
   */
  function scheduleNextBlink() {
    const randomDelay = 2000 + Math.random() * 2000;
    setTimeout(() => {
      triggerBlink();
      scheduleNextBlink();
    }, randomDelay);
  }

  /* ============================================================
   * TALKING ANIMATION (LIP-SYNC) VIA requestAnimationFrame
   * ============================================================ */

  /**
   * Animation loop that cycles the mouth ellipse through the
   * A/O/M phoneme shapes while speech synthesis is speaking.
   * @param {DOMHighResTimeStamp} timestamp - Provided by requestAnimationFrame.
   * @returns {void}
   */
  function animateMouthWhileSpeaking(timestamp) {
    if (!mouthAnimationStartTime) {
      mouthAnimationStartTime = timestamp;
    }
    const elapsed = timestamp - mouthAnimationStartTime;
    const phonemeIndex = Math.floor(elapsed / PHONEME_INTERVAL_MS) % PHONEME_SEQUENCE.length;
    const shape = PHONEME_SHAPES[PHONEME_SEQUENCE[phonemeIndex]];

    mouthShape.setAttribute('rx', shape.rx);
    mouthShape.setAttribute('ry', shape.ry);

    mouthAnimationFrameId = requestAnimationFrame(animateMouthWhileSpeaking);
  }

  /**
   * Starts the mouth lip-sync animation loop.
   * @returns {void}
   */
  function startMouthAnimation() {
    mouthAnimationStartTime = 0;
    mouthAnimationFrameId = requestAnimationFrame(animateMouthWhileSpeaking);
  }

  /**
   * Stops the mouth lip-sync animation and resets the mouth to rest shape.
   * @returns {void}
   */
  function stopMouthAnimation() {
    if (mouthAnimationFrameId !== null) {
      cancelAnimationFrame(mouthAnimationFrameId);
      mouthAnimationFrameId = null;
    }
    mouthShape.setAttribute('rx', PHONEME_SHAPES.REST.rx);
    mouthShape.setAttribute('ry', PHONEME_SHAPES.REST.ry);
  }

  /* ============================================================
   * REACTION ANIMATION (LISTENING NOD)
   * ============================================================ */

  /**
   * Toggles the light head-nod reaction animation used while listening.
   * @param {boolean} isActive - Whether the reaction should be active.
   * @returns {void}
   */
  function toggleListeningReaction(isActive) {
    headGroup.classList.toggle('reaction-nod', isActive);
  }

  /* ============================================================
   * BUTTON STATE MANAGEMENT
   * ============================================================ */

  /**
   * Updates the talk button's visual state and label.
   * @param {'default'|'listening'|'speaking'} state - The new UI state.
   * @returns {void}
   */
  function setButtonState(state) {
    currentButtonState = state;
    talkButton.classList.remove('state-default', 'state-listening', 'state-speaking');

    if (state === 'listening') {
      talkButton.textContent = '🔴 Shunchi...';
      talkButton.classList.add('state-listening');
    } else if (state === 'speaking') {
      talkButton.textContent = '🔊 Bolchi...';
      talkButton.classList.add('state-speaking');
    } else {
      talkButton.textContent = '🎤 Kotha Bolo';
      talkButton.classList.add('state-default');
    }
  }

  /* ============================================================
   * ERROR HANDLING
   * ============================================================ */

  /**
   * Displays a friendly Bangla error message for a few seconds.
   * @param {string} message - The Bangla error text to display.
   * @returns {void}
   */
  function showErrorMessage(message) {
    errorBox.textContent = message;
    errorBox.hidden = false;
    setTimeout(() => { errorBox.hidden = true; }, 4500);
  }

  /* ============================================================
   * SPEECH RECOGNITION (INPUT)
   * ============================================================ */

  /**
   * Creates and configures a SpeechRecognition instance for Bangla input.
   * Returns null and shows an error if the API is unsupported.
   * @returns {SpeechRecognition|null}
   */
  function createSpeechRecognitionInstance() {
    const RecognitionConstructor = window.SpeechRecognition || window.webkitSpeechRecognition;

    if (!RecognitionConstructor) {
      showErrorMessage('দুঃখিত, আপনার ব্রাউজার ভয়েস রিকগনিশন সাপোর্ট করে না। দয়া করে Chrome ব্রাউজার ব্যবহার করুন।');
      talkButton.disabled = true;
      return null;
    }

    const recognition = new RecognitionConstructor();
    recognition.lang = 'bn-BD';
    recognition.continuous = true;
    recognition.interimResults = true;
    recognition.maxAlternatives = 1;
    return recognition;
  }

  /**
   * Resets the 3-second silence auto-stop timer. Called on every
   * recognition result to keep the session alive while user is speaking.
   * @returns {void}
   */
  function resetSilenceTimer() {
    if (silenceTimerId) clearTimeout(silenceTimerId);
    silenceTimerId = setTimeout(() => {
      if (recognitionInstance) {
        try { recognitionInstance.stop(); } catch (err) { /* already stopped */ }
      }
    }, SILENCE_TIMEOUT_MS);
  }

  /**
   * Handles incoming recognition results: shows interim text live,
   * and on a final result, displays it then triggers the echo after delay.
   * @param {SpeechRecognitionEvent} event
   * @returns {void}
   */
  function handleRecognitionResult(event) {
    resetSilenceTimer();
    let finalTranscript = '';
    let interimTranscript = '';

    for (let i = event.resultIndex; i < event.results.length; i++) {
      const result = event.results[i];
      if (result.isFinal) {
        finalTranscript += result[0].transcript;
      } else {
        interimTranscript += result[0].transcript;
      }
    }

    if (interimTranscript.trim().length > 0) {
      transcriptBox.textContent = interimTranscript;
    }

    if (finalTranscript.trim().length > 0) {
      transcriptBox.textContent = finalTranscript;
      if (silenceTimerId) clearTimeout(silenceTimerId);
      try { recognitionInstance.stop(); } catch (err) { /* no-op */ }
      setTimeout(() => speakText(finalTranscript), ECHO_DELAY_MS);
    }
  }

  /**
   * Handles recognition errors, showing a Bangla message tailored
   * to common failure cases (mic permission, no speech, network).
   * @param {SpeechRecognitionErrorEvent} event
   * @returns {void}
   */
  function handleRecognitionError(event) {
    if (event.error === 'not-allowed' || event.error === 'service-not-allowed') {
      showErrorMessage('মাইক্রোফোন ব্যবহারের অনুমতি পাওয়া যায়নি। দয়া করে ব্রাউজার সেটিংস থেকে মাইক্রোফোন অ্যাক্সেস দিন।');
    } else if (event.error === 'no-speech') {
      showErrorMessage('কোনো কথা শোনা যায়নি। আবার চেষ্টা করুন।');
    } else if (event.error === 'network') {
      showErrorMessage('নেটওয়ার্ক সমস্যা হয়েছে। ইন্টারনেট সংযোগ চেক করুন।');
    } else {
      showErrorMessage('একটি সমস্যা হয়েছে: ' + event.error);
    }
  }

  /**
   * Starts a fresh listening session: clears old transcript and
   * begins speech recognition, updating UI state accordingly.
   * @returns {void}
   */
  function startListening() {
    if (!recognitionInstance) return;
    transcriptBox.textContent = '';
    try {
      recognitionInstance.start();
    } catch (err) {
      showErrorMessage('মাইক্রোফোন চালু করা যায়নি। আবার চেষ্টা করুন।');
    }
  }

  /* ============================================================
   * SPEECH SYNTHESIS (OUTPUT / ECHO)
   * ============================================================ */

  /**
   * Caches the list of available voices from the speech synthesis API.
   * @returns {void}
   */
  function refreshVoiceCache() {
    cachedVoices = window.speechSynthesis.getVoices();
  }

  /**
   * Selects the best available Bangla voice using a priority order:
   * 1) A Google Bangla Female voice, 2) any bn-BD voice, 3) null (browser default).
   * @returns {SpeechSynthesisVoice|null}
   */
  function selectBestBanglaVoice() {
    if (cachedVoices.length === 0) refreshVoiceCache();

    const googleBanglaFemale = cachedVoices.find((voice) =>
      voice.lang === 'bn-BD' && /google/i.test(voice.name) && /female/i.test(voice.name)
    );
    if (googleBanglaFemale) return googleBanglaFemale;

    const anyBnBD = cachedVoices.find((voice) => voice.lang === 'bn-BD');
    if (anyBnBD) return anyBnBD;

    const anyBangla = cachedVoices.find((voice) => voice.lang && voice.lang.toLowerCase().startsWith('bn'));
    return anyBangla || null;
  }

  /**
   * Speaks the given text using SpeechSynthesis with pitch=1.8, rate=1.05,
   * and drives the mouth lip-sync animation for the duration of speech.
   * @param {string} text - The text to be echoed back to the user.
   * @returns {void}
   */
  function speakText(text) {
    if (!('speechSynthesis' in window)) {
      showErrorMessage('আপনার ব্রাউজার ভয়েস আউটপুট সাপোর্ট করে না।');
      setButtonState('default');
      return;
    }

    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = 'bn-BD';
    utterance.pitch = 1.8;
    utterance.rate = 1.05;

    const chosenVoice = selectBestBanglaVoice();
    if (chosenVoice) utterance.voice = chosenVoice;

    utterance.onstart = () => {
      setButtonState('speaking');
      startMouthAnimation();
    };

    utterance.onend = () => {
      stopMouthAnimation();
      setButtonState('default');
    };

    utterance.onerror = () => {
      stopMouthAnimation();
      setButtonState('default');
      showErrorMessage('কথা বলতে সমস্যা হয়েছে।');
    };

    window.speechSynthesis.speak(utterance);
  }

  /* ============================================================
   * BUTTON CLICK HANDLER
   * ============================================================ */

  /**
   * Handles clicks on the main talk button, branching behaviour
   * based on the current UI state (default / listening / speaking).
   * @returns {void}
   */
  function handleTalkButtonClick() {
    if (currentButtonState === 'listening') {
      if (recognitionInstance) {
        try { recognitionInstance.stop(); } catch (err) { /* no-op */ }
      }
      return;
    }
    if (currentButtonState === 'speaking') {
      return; // Ignore clicks while the character is speaking
    }
    startListening();
  }

  /* ============================================================
   * INITIALIZATION
   * ============================================================ */

  /**
   * Bootstraps the app: sets up recognition, voice cache, idle
   * animations, and all event listeners.
   * @returns {void}
   */
  function initializeApp() {
    recognitionInstance = createSpeechRecognitionInstance();

    if (recognitionInstance) {
      recognitionInstance.onstart = () => {
        setButtonState('listening');
        toggleListeningReaction(true);
        resetSilenceTimer();
      };
      recognitionInstance.onresult = handleRecognitionResult;
      recognitionInstance.onerror = handleRecognitionError;
      recognitionInstance.onend = () => {
        toggleListeningReaction(false);
        if (silenceTimerId) clearTimeout(silenceTimerId);
        if (currentButtonState === 'listening') setButtonState('default');
      };
    }

    if ('speechSynthesis' in window) {
      refreshVoiceCache();
      window.speechSynthesis.onvoiceschanged = refreshVoiceCache;
    } else {
      showErrorMessage('আপনার ব্রাউজার ভয়েস আউটপুট সাপোর্ট করে না।');
    }

    talkButton.addEventListener('click', handleTalkButtonClick);

    stopMouthAnimation(); // set mouth to rest shape initially
    scheduleNextBlink();  // start idle random blink loop
  }

  window.addEventListener('DOMContentLoaded', initializeApp);
</script>
