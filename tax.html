<!DOCTYPE html>
<html lang="en">
<head>
  <script>
if(window.location.hostname.includes("github.io")){
  window.location.replace("https://my-tools-muja.vercel.app" + window.location.pathname.replace("/My-tools",""));
}
  </script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tax Category - My Tools</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap');

body{
  background: linear-gradient(135deg, #0a0f1e 0%, #1a2333 100%);
  color:#fff; 
  font-family:'Poppins', sans-serif; 
  margin:0; 
  padding:20px;
  min-height:100vh;
}
.back{
  margin-bottom:20px; 
  font-size:0.9rem
} 
.back a{
  color:#fbbf24; 
  text-decoration:none;
  font-weight:600;
  transition:0.3s;
}
.back a:hover{color:#fcd34d}

h1{
  text-align:center; 
  margin-bottom:10px;
  font-size:1.8rem;
  background: linear-gradient(90deg, #fbbf24, #f59e0b);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
}
.subtitle{
  text-align:center;
  opacity:0.6;
  font-size:0.85rem;
  margin-bottom:30px;
}

.grid{
  display:grid; 
  grid-template-columns:repeat(2, 1fr); 
  gap:18px; 
  max-width:500px; 
  margin:0 auto
}

.card{
  background: rgba(255,255,255,0.05); 
  backdrop-filter: blur(20px);
  border:1px solid rgba(255,255,255,0.1); 
  border-radius:20px; 
  padding:28px 15px; 
  text-align:center; 
  cursor:pointer; 
  transition:0.4s;
  position:relative;
  overflow:hidden;
}
.card::before{
  content:'';
  position:absolute;
  top:0; left:-100%;
  width:100%; height:100%;
  background: linear-gradient(90deg, transparent, rgba(251,191,36,0.2), transparent);
  transition:0.5s;
}
.card:hover::before{left:100%}
.card:hover{
  transform:translateY(-8px) scale(1.02); 
  border-color:#fbbf24;
  box-shadow: 0 0 30px rgba(251,191,36,0.4);
}

.icon{
  font-size:3rem; 
  margin-bottom:12px;
  filter: drop-shadow(0 0 10px rgba(251,191,36,0.5));
}
.card h3{
  font-size:0.95rem; 
  margin:0 0 6px 0;
  font-weight:600;
}
.card p{
  font-size:0.75rem; 
  opacity:0.6; 
  margin:0
}

footer{
  text-align:center; 
  margin-top:50px; 
  padding-top:20px;
  border-top:1px solid rgba(255,255,255,0.1);
}
.made{
  font-size:0.85rem; 
  opacity:0.7;
}
.heart{
  color:#ff4d6d;
  animation: beat 1.2s infinite;
  display:inline-block;
}
@keyframes beat{
  0%,100%{transform:scale(1)}
  50%{transform:scale(1.3)}
}

@media(min-width:768px){ 
  .grid{grid-template-columns:repeat(4,1fr); max-width:1000px} 
}
</style>
</head>
<body>
<div class="back"><a href="index.html">← back to home</a></div>
<h1>🧾 Tax Category</h1>
<p class="subtitle">TDS, Income Tax, PPF, FD Calculator</p>

<div class="grid">
  <div class="card" onclick="location.href='tds-calculator.html'">
    <div class="icon">📊</div>
    <h3>TDS Calculator 2026</h3>
    <p>Salary + 80C + HRA</p>
  </div>

  <div class="card" onclick="location.href='income-tax-calculator.html'">
    <div class="icon">🧾</div>
    <h3>Income Tax</h3>
    <p>New vs Old Regime</p>
  </div>

  <div class="card" onclick="location.href='ppf-calculator.html'">
    <div class="icon">🏦</div>
    <h3>PPF Calculator</h3>
    <p>15 Year + PDF</p>
  </div>

  <div class="card" onclick="location.href='fd-calculator.html'">
    <div class="icon">📈</div>
    <h3>FD Calculator</h3>
    <p>Senior Citizen + TDS</p>
  </div>
</div>

<footer>
  <div class="made">made by mujahar <span class="heart">♥</span></div>
</footer>
</body>
</html>
