<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GradientGod - Free Gradient Generator 2026</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
        
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #6366f1 0%, #a855f7 50%, #00ff88 100%);
            background-size: 200% 200%;
            animation: bgMove 10s ease infinite;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }
        
        @keyframes bgMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        
        /* Background glow */
        body::before {
            content: '';
            position: absolute;
            width: 400px;
            height: 400px;
            background: radial-gradient(circle, rgba(0,255,136,0.3) 0%, transparent 70%);
            top: -100px;
            right: -100px;
            filter: blur(60px);
            z-index: 0;
        }

        /* ===== FLOATING EMOJIS ===== */
        .float-emoji {
            position: absolute;
            font-size: 2.5rem;
            opacity: 0.12;
            animation: floatUp 15s linear infinite;
            z-index: 0;
            pointer-events: none;
        }
        .float-emoji:nth-child(1) { left: 8%; animation-delay: 0s; font-size: 2.2rem; }
        .float-emoji:nth-child(2) { left: 75%; animation-delay: 3s; font-size: 3rem; }
        .float-emoji:nth-child(3) { left: 35%; animation-delay: 6s; font-size: 2rem; }
        .float-emoji:nth-child(4) { left: 88%; animation-delay: 9s; font-size: 2.8rem; }
        .float-emoji:nth-child(5) { left: 20%; animation-delay: 12s; font-size: 2.4rem; }
        .float-emoji:nth-child(6) { left: 60%; animation-delay: 4s; font-size: 2.1rem; }

        @keyframes floatUp {
            0% { transform: translateY(100vh) rotate(0deg); }
            100% { transform: translateY(-20vh) rotate(720deg); }
        }
        
        .back-btn {
            position: absolute;
            top: 24px;
            left: 24px;
            color: #fff;
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 500;
            opacity: 0.9;
            z-index: 2;
        }
        
        .logo-icon {
            font-size: 4rem;
            filter: drop-shadow(0 0 25px rgba(0,255,136,0.7));
            margin-bottom: 12px;
            z-index: 2;
        }

        .main-title {
            font-size: 2.4rem;
            font-weight: 800;
            color: #fff;
            text-shadow: 0 2px 20px rgba(0,0,0,0.3);
            margin-bottom: 30px;
            z-index: 2;
        }

        .card {
            background: rgba(255, 255, 255, 0.12);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 24px;
            padding: 32px 24px;
            max-width: 420px;
            width: 100%;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0,0,0,0.3);
            z-index: 2;
            position: relative;
        }

        .card-dot {
            display: inline-block;
            width: 10px;
            height: 10px;
            background: #00ff88;
            border-radius: 50%;
            margin-right: 8px;
            box-shadow: 0 0 10px #00ff88;
        }

        .card-title {
            font-size: 1.5rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 12px;
        }

        .card-desc {
            font-size: 0.95rem;
            color: rgba(255,255,255,0.9);
            line-height: 1.6;
            margin-bottom: 24px;
        }

        .open-btn {
            background: linear-gradient(135deg, #6366f1, #00ff88);
            color: #fff;
            border: none;
            padding: 16px 24px;
            border-radius: 16px;
            font-size: 1.05rem;
            font-weight: 700;
            width: 100%;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 8px 20px rgba(99,102,241,0.4);
        }
        .open-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 30px rgba(99,102,241,0.6);
        }
    </style>
</head>
<body>
    <!-- FLOATING EMOJIS -->
    <div class="float-emoji">🌈</div>
    <div class="float-emoji">✨</div>
    <div class="float-emoji">🎨</div>
    <div class="float-emoji">🖌️</div>
    <div class="float-emoji">💫</div>
    <div class="float-emoji">🌊</div>

    <a href="index.html" class="back-btn">← Back to Home</a>
    
    <div class="logo-icon">🌈</div>
    <h1 class="main-title">GradientGod</h1>

    <div class="card">
        <h2 class="card-title"><span class="card-dot"></span>Pro Gradient Tool</h2>
        <p class="card-desc">
            20 Colors, Animated, Mesh, AI Name + 
            Real 4K PNG, SVG Export 🚀
        </p>
        <button class="btn btn-love" onclick="window.location.href='gradient-generator.html'">🌈 Open</button>
  </div>
</body>
  </html>
