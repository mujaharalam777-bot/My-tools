<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GradientGod - Free Gradient Generator 2026</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
        
        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #8b5cf6 0%, #6366f1 50%, #3b82f6 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            overflow: hidden;
        }
        
        /* ===== FLOATING EMOJIS ===== */
        .float-emoji {
            position: absolute;
            font-size: 2.2rem;
            opacity: 0.15;
            animation: floatUp 14s linear infinite;
            z-index: 0;
            pointer-events: none;
        }
        .float-emoji:nth-child(1) { left: 10%; animation-delay: 0s; }
        .float-emoji:nth-child(2) { left: 80%; animation-delay: 2s; font-size: 2.8rem; }
        .float-emoji:nth-child(3) { left: 40%; animation-delay: 4s; }
        .float-emoji:nth-child(4) { left: 90%; animation-delay: 6s; font-size: 2.5rem; }
        .float-emoji:nth-child(5) { left: 25%; animation-delay: 8s; }
        .float-emoji:nth-child(6) { left: 65%; animation-delay: 10s; font-size: 2rem; }

        @keyframes floatUp {
            0% { transform: translateY(100vh) rotate(0deg); }
            100% { transform: translateY(-20vh) rotate(720deg); }
        }
        
        .back-btn {
            position: absolute;
            top: 24px;
            left: 24px;
            color: #fff;
            text-decoration: none;
            font-size: 1rem;
            font-weight: 500;
            z-index: 2;
        }
        
        .logo-icon {
            font-size: 4.5rem;
            filter: drop-shadow(0 0 30px rgba(139,92,246,0.8));
            margin-bottom: 12px;
            z-index: 2;
            animation: pulse 2s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); }
        }

        .main-title {
            font-size: 2.5rem;
            font-weight: 800;
            color: #fff;
            text-shadow: 0 4px 20px rgba(0,0,0,0.3);
            margin-bottom: 30px;
            z-index: 2;
        }

        .card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 28px;
            padding: 35px 25px;
            max-width: 420px;
            width: 100%;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0,0,0,0.25);
            z-index: 2;
            position: relative;
        }

        .card-dot {
            display: inline-block;
            width: 12px;
            height: 12px;
            background: #00ff88;
            border-radius: 50%;
            margin-right: 10px;
            box-shadow: 0 0 15px #00ff88;
        }

        .card-title {
            font-size: 1.6rem;
            font-weight: 700;
            color: #fff;
            margin-bottom: 14px;
        }

        .card-desc {
            font-size: 0.95rem;
            color: rgba(255,255,255,0.9);
            line-height: 1.7;
            margin-bottom: 28px;
        }

        .open-btn {
            background: linear-gradient(135deg, #8b5cf6, #00ff88);
            color: #fff;
            border: none;
            padding: 18px 24px;
            border-radius: 18px;
            font-size: 1.1rem;
            font-weight: 700;
            width: 100%;
            cursor: pointer;
            transition: all 0.3s;
            box-shadow: 0 10px 30px rgba(139,92,246,0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }
        .open-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(139,92,246,0.7);
        }
    </style>
</head>
<body>
    <!-- FLOATING EMOJIS -->
    <div class="float-emoji">🌈</div>
    <div class="float-emoji">✨</div>
    <div class="float-emoji">🎨</div>
    <div class="float-emoji">🖌️</div>
    <div class="float-emoji">💫</div>
    <div class="float-emoji">🌊</div>

    <a href="index.html" class="back-btn">← Back to Home</a>
    
    <div class="logo-icon">🌈</div>
    <h1 class="main-title">GradientGod</h1>

    <div class="card">
        <h2 class="card-title"><span class="card-dot"></span>Pro Gradient Tool</h2>
        <p class="card-desc">
            20 Colors, Animated, Mesh, AI Name + 
            Real 4K PNG, SVG Export 🚀
        </p>
        <button class="open-btn" onclick="window.location.href='gradient-generator.html'">
            🌈 Open Gradient Tool
        </button>
    </div>

</body>
</html>
