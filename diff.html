<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diff Checker Card - Premium</title>
    <style>
        /* Main Body Settings */
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #0f0c29, #302b63, #24243e); /* Deep blue/purple premium gradient */
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden; /* Prevents scrollbars from floating emojis */
            position: relative;
        }

        /* Top Left Back Button */
        .back-btn {
            position: absolute;
            top: 30px;
            left: 30px;
            color: rgba(255, 255, 255, 0.7);
            text-decoration: none;
            font-size: 16px;
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 6px;
            z-index: 20; /* Keeps it above everything */
            transition: color 0.3s ease;
        }

        .back-btn:hover {
            color: #00d9ff; /* Neon cyan glow on hover */
        }

        /* 10 Floating Emojis Container */
        .floating-emojis {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none; /* Allows clicking through emojis */
            z-index: 1;
        }

        .emoji {
            position: absolute;
            opacity: 0;
            animation: floatUp linear infinite;
            filter: drop-shadow(0 0 10px rgba(0, 217, 255, 0.25));
        }

        /* Exactly 10 emojis with different positions, sizes, and speeds */
        .e1 { left: 8%; bottom: -50px; animation-duration: 8s; animation-delay: 0s; font-size: 28px; }
        .e2 { left: 22%; bottom: -50px; animation-duration: 10s; animation-delay: 2s; font-size: 20px; }
        .e3 { left: 14%; bottom: -50px; animation-duration: 12s; animation-delay: 4s; font-size: 32px; }
        .e4 { left: 38%; bottom: -50px; animation-duration: 7s; animation-delay: 1s; font-size: 24px; }
        .e5 { left: 68%; bottom: -50px; animation-duration: 11s; animation-delay: 3s; font-size: 30px; }
        .e6 { left: 78%; bottom: -50px; animation-duration: 9s; animation-delay: 0.5s; font-size: 22px; }
        .e7 { left: 84%; bottom: -50px; animation-duration: 13s; animation-delay: 5s; font-size: 26px; }
        .e8 { left: 54%; bottom: -50px; animation-duration: 8.5s; animation-delay: 2.5s; font-size: 28px; }
        .e9 { left: 33%; bottom: -50px; animation-duration: 14s; animation-delay: 1.5s; font-size: 20px; }
        .e10 { left: 90%; bottom: -50px; animation-duration: 9.5s; animation-delay: 6s; font-size: 24px; }

        @keyframes floatUp {
            0% {
                transform: translateY(0) rotate(0deg) scale(0.8);
                opacity: 0;
            }
            15% { opacity: 0.6; }
            85% { opacity: 0.6; }
            100% {
                transform: translateY(-120vh) rotate(360deg) scale(1.2);
                opacity: 0;
            }
        }

        /* The Card Container (Glassmorphism Dark - Premium Blue/Purple) */
        .diff-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 24px;
            padding: 32px 24px;
            width: 340px;
            text-align: center;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4), 0 0 40px rgba(0, 217, 255, 0.08);
            z-index: 10; /* Keeps card above emojis */
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
        }

        .diff-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5), 0 0 60px rgba(0, 217, 255, 0.15);
        }

        /* Header Section */
        .card-header {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            margin-bottom: 12px;
        }

        /* Glowing Dot */
        .glow-dot {
            width: 12px;
            height: 12px;
            background-color: #00d9ff;
            border-radius: 50%;
            box-shadow: 0 0 12px #00d9ff, 0 0 20px #00d9ff;
        }

        /* Title Styling */
        .card-title {
            color: #ffffff;
            font-size: 24px;
            font-weight: 800;
            margin: 0;
            letter-spacing: 0.5px;
        }

        /* Description Text */
        .card-desc {
            color: rgba(255, 255, 255, 0.7);
            font-size: 14px;
            line-height: 1.5;
            margin: 0 0 28px 0;
        }

        /* Big Open Button (Neon Cyan) */
        .open-btn {
            width: 100%;
            background: #00d9ff; 
            color: #0d1117; 
            border: none;
            padding: 16px;
            border-radius: 16px; 
            font-size: 18px;
            font-weight: 800;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s, background-color 0.2s;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 15px rgba(0, 217, 255, 0.3);
            pointer-events: auto; /* Button remains clickable even if card is clickable */
        }

        .open-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 217, 255, 0.5);
            background: #00c8ea;
        }

        .open-btn:active {
            transform: translateY(1px);
        }

        /* Make the whole card clickable but don't override button */
        .card-clickable {
            position: absolute;
            inset: 0;
            z-index: 1;
            background: transparent;
            border: none;
            cursor: pointer;
        }

        /* Ensure content above the transparent overlay */
        .card-content {
            position: relative;
            z-index: 2;
        }

        /* Mobile Adjustments for Back Button */
        @media (max-width: 480px) {
            .back-btn {
                top: 20px;
                left: 20px;
                font-size: 14px;
            }
            .diff-card {
                width: 290px;
                padding: 28px 18px;
            }
        }
    </style>
</head>
<body>

    <!-- Top Left Back Button -->
    <a href="index.html" class="back-btn">← Back to Home</a>

    <!-- 10 Floating Emojis Background -->
    <div class="floating-emojis">
        <div class="emoji e1">📊</div>
        <div class="emoji e2">🔍</div>
        <div class="emoji e3">🔄</div>
        <div class="emoji e4">📝</div>
        <div class="emoji e5">💻</div>
        <div class="emoji e6">📑</div>
        <div class="emoji e7">🕵️‍♂️</div>
        <div class="emoji e8">⚖️</div>
        <div class="emoji e9">🧩</div>
        <div class="emoji e10">🔎</div>
    </div>

    <!-- Diff Checker Card Wrapper -->
    <div class="diff-card" onclick="window.location.href='diff-cheaker.html'">
        <!-- Transparent overlay to ensure whole card is clickable (optional but works) -->
        <div class="card-content">
            <!-- Title with Glowing Dot -->
            <div class="card-header">
                <span class="glow-dot"></span>
                <h2 class="card-title">Diff Checker</h2>
            </div>
            
            <!-- Subtitle/Description -->
            <p class="card-desc">Compare text, code & files in real-time with side‑by‑side precision 🔍</p>
            
            <!-- Big Action Button (also triggers navigation) -->
            <button class="open-btn" onclick="event.stopPropagation(); window.location.href='diff-cheaker.html'">Open Diff Checker</button>
        </div>
    </div>

</body>
</html>
