<!DOCTYPE html>
<html lang="en">
<head>
 <script>
if(window.location.hostname.includes("github.io")){
  window.location.replace("https://my-tools-muja.vercel.app" + window.location.pathname.replace("/My-tools",""));
}
 </script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Favicon Generator Card</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Poppins', system-ui,sans-serif}
  
  body{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    /* Gradient background same as screenshot */
    background: linear-gradient(135deg, #8B5CF6 0%, #A855F7 25%, #EC4899 50%, #3B82F6 100%);
    padding:20px;
    overflow:hidden;
  }

  /* Background glow effect */
  body::before{
    content:'';
    position:absolute;
    width:400px;height:400px;
    background: radial-gradient(circle, rgba(255,255,255,0.2) 0%, transparent 70%);
    top:-100px;left:-100px;
    filter:blur(60px);
  }

  .wrapper{
    text-align:center;
    z-index:2;
  }

  .logo{
    font-size:4rem;
    margin-bottom:10px;
    filter: drop-shadow(0 0 20px rgba(255,255,255,0.6));
    animation: float 3s ease-in-out infinite;
  }
  @keyframes float{
    0%,100%{transform:translateY(0)}
    50%{transform:translateY(-10px)}
  }

  .title{
    font-size:2.5rem;
    font-weight:800;
    color:#fff;
    text-shadow: 0 4px 20px rgba(0,0,0,0.3);
    margin-bottom:30px;
  }

  /* Glass Card */
  .glass-card{
    background: rgba(255,255,255,0.15);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgba(255,255,255,0.25);
    border-radius: 24px;
    padding: 30px 25px;
    width: 100%;
    max-width: 380px;
    margin: 0 auto;
    box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    transition: transform 0.3s ease;
  }
  .glass-card:hover{
    transform: translateY(-5px);
  }

  .card-header{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    margin-bottom:15px;
  }

  .dot{
    width:10px;height:10px;
    background:#22c55e;
    border-radius:50%;
    box-shadow:0 0 10px #22c55e;
    animation: pulse 2s infinite;
  }
  @keyframes pulse{
    0%,100%{opacity:1}
    50%{opacity:0.5}
  }

  .card-title{
    font-size:1.4rem;
    font-weight:700;
    color:#fff;
  }

  .card-desc{
    color:rgba(255,255,255,0.9);
    font-size:0.95rem;
    line-height:1.6;
    margin-bottom:20px;
  }

  .btn-open{
    background: rgba(255,255,255,0.95);
    color:#0f172a;
    border:none;
    padding:12px 28px;
    border-radius:12px;
    font-size:1rem;
    font-weight:600;
    cursor:pointer;
    display:inline-flex;
    align-items:center;
    gap:8px;
    transition: all 0.3s ease;
    box-shadow: 0 4px 15px rgba(0,0,0,0.2);
  }
  .btn-open:hover{
    transform: scale(1.05);
    background:#fff;
    box-shadow: 0 6px 25px rgba(255,255,255,0.4);
  }

  /* Responsive */
  @media(max-width:480px){
    .title{font-size:2rem}
    .glass-card{padding:25px 20px}
  }
</style>
</head>
<body>

<div class="wrapper">
  <!-- Logo -->
  <div class="logo">⚡</div> <!-- Ekhane favicon emoji boshabe -->
  
  <!-- Title -->
  <h1 class="title">FaviconGod</h1>

  <!-- Glass Card -->
  <div class="glass-card">
    <div class="card-header">
      <span class="dot"></span>
      <h2 class="card-title">Pro Favicon Tool</h2>
    </div>
    
    <p class="card-desc">
      AI, Animated, Gradient + BG Remover <br>
      ICO, PNG, SVG, WEBP Export 🚀 <br>
      100% Free, No Login, No Watermark
    </p>
    
    <button class="btn-open" onclick="window.location.href='favicon-me.html'">
      ⚡ Open
    </button>
  </div>
</div>

</body>
</html>
